<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="../../assets/js/covers.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="icon"
      type="image/svg+xml"
      href="../../assets/img/icons/logo.svg"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap"
      rel="stylesheet"
    />
    <title>SONG COVERS</title>
    <link rel="stylesheet" href="../../assets/CSS/covers.css" />
  </head>
  <body>
    <main>
      <!--cabecera de la pagina-->
      <header class="covers-header">
        <h1>COVERS</h1>
        <div class="info-header">
          <a class="btn-contact" href="../contacto/contact.html">CONTACTAME</a>
          <a class="btn-back" href="../../index.html">VOLVER</a>
        </div>
      </header>

      <!--cuerpo principal de la pagina-->

      <section class="container">
        <div
          class="carrousel"
          role="group"
          aria-roledescription="carrusel"
          aria-label="Portadas de canciones"
        >
          <div class="img-carrousel">
            <img
              id="current-img"
              class="current-img"
              src="../../assets/img/covers/BurnoutCover.webp"
              alt="Portada de Burnout"
            />
            <p class="info-cover" aria-live="polite">
              01 - Burnout <br />
              Genero Jazz - portada de albúm completo
            </p>
          </div>

          <div class="carrousel-controls">
            <button
              type="button"
              id="prev"
              class="prev"
              aria-label="ver portada anterior"
            >
              <
            </button>
            <p class="covers-count" id="covers-count">1 / 7</p>
            <button
              type="button"
              id="next"
              class="next"
              aria-label="ver portada siguiente"
            >
              >
            </button>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
