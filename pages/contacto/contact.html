<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script src="../../assets/js/contact.js" defer></script>
    <link
      rel="icon"
      type="image/svg+xml"
      href="../../assets/img/icons/logo.svg"
    />
    <title>CONTACTO - ELSE WHERE</title>
    <link rel="stylesheet" href="../../assets/CSS/contact.css" />
  </head>
  <body>
    <main class="main-content">
      <header class="header-contact">
        <h1>CONTACT ME</h1>
        <div class="info-header">
          <p>disponible para proyectos</p>
          <a href="../../index.html">VOLVER</a>
        </div>
      </header>

      <!--Sección principal-->
      <div class="main-section">
        <section class="eye-catching-info">
          <div>
            <h2>
              <span>CONTAME TU IDEA Y</span>YO TE <br />
              ESCRIBO
            </h2>
            <p>
              Contame qué proyecto tenés en mente.<br />Respondo dentro de las
              48 horas.
            </p>
          </div>
          <!--Sección interna de contacto directo-->
          <address class="adress-section">
            <img
              src="../../assets/img/icons/mail-icon.svg"
              alt="icono de correo"
            />
            <dl class="table">
              <div>
                <dt>Email</dt>
                <dd class="table-a">
                  <a href="mailto:ochoaalan2020@gmail.com"
                    >ochoaalan2020@gmail.com</a
                  >
                </dd>
              </div>
              <div>
                <dt>Teléfono</dt>
                <dd class="table-a">
                  <a href="tel:+542657354631">(+54) 2657 354631</a>
                </dd>
              </div>
            </dl>
          </address>
        </section>

        <!--Sección del formulario-->
        <section class="main-form">
          <form
            id="form"
            action="#"
            method="post"
            aria-labelledby="form-title"
            novalidate
          >
            <h2 id="form-title">ESCRIBIME</h2>
            <div class="grid">
              <div class="left-column">
                <div class="form-areas">
                  <label for="nombre">Nombre *</label>
                  <input
                    class="input-form"
                    id="nombre"
                    name="nombre"
                    type="text"
                    required
                    minlength="2"
                    maxlength="60"
                    autocomplete="given-name"
                  />
                </div>
                <div class="form-areas">
                  <label for="apellido">Apellido</label>
                  <input
                    class="input-form"
                    id="apellido"
                    name="apellido"
                    type="text"
                    minlength="2"
                    maxlength="60"
                    autocomplete="family-name"
                  />
                </div>
              </div>
              <div class="right-column">
                <div class="form-areas">
                  <label for="telefono">Teléfono *</label>
                  <input
                    class="input-form"
                    id="telefono"
                    name="telefono"
                    type="tel"
                    required
                    maxlength="20"
                    autocomplete="tel"
                    inputmode="tel"
                  />
                </div>
                <div class="form-areas">
                  <label for="email">Email *</label>
                  <input
                    class="input-form"
                    id="email"
                    name="email"
                    type="email"
                    required
                    maxlength="254"
                    autocomplete="email"
                  />
                </div>
              </div>
            </div>
            <div class="form-areas">
              <label for="descripcion">Descripción del proyecto *</label>
              <textarea
                class="input-form"
                name="descripcion"
                id="descripcion"
                rows="4"
                required
                minlength="10"
                maxlength="250"
                autocomplete="off"
              ></textarea>
            </div>
            <div id="resume"></div>
            <button type="submit">Enviar</button>
          </form>
        </section>
      </div>

      <!--pie de pagina-->
      <footer class="footer-contact">
        <p>Villa Mercedes, San Luis * 2026</p>
        <a class="home" href="../../index.html">PAGINA PRINCIPAL</a>
        <div class="social-media">
          <p>También podés seguirme</p>
          <a
            class="to-social"
            href="https://www.instagram.com/asoulview.design"
            target="_blank"
          >
            <img
              src="../../assets/img/icons/instagram-round-svgrepo-com.svg"
              alt="icono de instagram"
            />
          </a>
          <a
            class="to-social"
            href="https://www.behance.net/asoulview"
            target="_blank"
            ><img
              src="../../assets/img/icons/behance-round-svgrepo-com.svg"
              alt="icono de behance"
          /></a>
        </div>
      </footer>
    </main>
  </body>
</html>
